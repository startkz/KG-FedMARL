name: Discover compile runs
on:
  push:
    branches: [ compile-fast-20260819 ]
    paths: [ '.github/workflows/discover_compile_runs.yml' ]
permissions:
  actions: read
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          sha='d55a71641e3cb604a34ce18b9a9d7414a0b41bda'
          url=f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={sha}&per_page=100"
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          lines=[]
          for x in data.get('workflow_runs',[]):
              lines.append(f"{x['id']}\t{x['name']}\t{x['status']}\t{x.get('conclusion')}\t{x['head_sha']}\t{x['path']}")
          open('manuscript/discovered_compile_runs.txt','w').write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f manuscript/discovered_compile_runs.txt
          git commit -m 'debug: record compile workflow run ids'
          git push origin HEAD:compile-fast-20260819
