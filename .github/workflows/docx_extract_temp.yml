name: Temporary DOCX extraction

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/docx_extract_temp.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python-docx
        run: pip install python-docx
      - name: Extract document content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from docx import Document
          from docx.table import Table
          from docx.text.paragraph import Paragraph
          from docx.oxml.table import CT_Tbl
          from docx.oxml.text.paragraph import CT_P

          src = Path('manuscript/translation/RK-Guard_中文翻译审校润色稿.docx')
          doc = Document(src)

          def iter_blocks(parent):
              parent_elm = parent.element.body
              for child in parent_elm.iterchildren():
                  if isinstance(child, CT_P):
                      yield Paragraph(child, parent)
                  elif isinstance(child, CT_Tbl):
                      yield Table(child, parent)

          blocks = []
          p_index = 0
          t_index = 0
          for block in iter_blocks(doc):
              if isinstance(block, Paragraph):
                  blocks.append({
                      'type': 'paragraph',
                      'index': p_index,
                      'style': block.style.name if block.style else '',
                      'text': block.text,
                      'runs': [{'text': r.text, 'bold': r.bold, 'italic': r.italic} for r in block.runs],
                  })
                  p_index += 1
              else:
                  rows = []
                  for ri, row in enumerate(block.rows):
                      cells = []
                      for ci, cell in enumerate(row.cells):
                          cells.append({
                              'row': ri,
                              'col': ci,
                              'paragraphs': [
                                  {
                                      'style': p.style.name if p.style else '',
                                      'text': p.text,
                                      'runs': [{'text': r.text, 'bold': r.bold, 'italic': r.italic} for r in p.runs],
                                  }
                                  for p in cell.paragraphs
                              ],
                          })
                      rows.append(cells)
                  blocks.append({'type': 'table', 'index': t_index, 'rows': rows})
                  t_index += 1

          out = {
              'source': str(src),
              'paragraph_count': p_index,
              'table_count': t_index,
              'blocks': blocks,
          }
          Path('docx_extract.json').write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding='utf-8')
          with Path('docx_extract.txt').open('w', encoding='utf-8') as f:
              for b in blocks:
                  if b['type'] == 'paragraph':
                      f.write(f"[P{b['index']:04d}|{b['style']}] {b['text']}\n")
                  else:
                      f.write(f"[TABLE {b['index']}]\n")
                      for row in b['rows']:
                          vals=[]
                          for cell in row:
                              vals.append(' / '.join(p['text'] for p in cell['paragraphs']))
                          f.write(' | '.join(vals) + '\n')
          PY
      - name: Upload extraction artifact
        uses: actions/upload-artifact@v4
        with:
          name: rkguard-chinese-docx-extract
          path: |
            manuscript/translation/RK-Guard_中文翻译审校润色稿.docx
            docx_extract.json
            docx_extract.txt
          retention-days: 2
