name: Feeder-level recovery experiments

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/feeder_results.yml'
      - 'manuscript/figures/Code/feeder_runtime_*.py'
      - 'manuscript/figures/Code/feeder_experiment_io.py'
      - 'manuscript/figures/Code/plot_feeder_results.py'
      - 'manuscript/figures/Code/kgfedmarl_env.zip'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feeder-results:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENDSS_COMMIT: 5005c668a72d20775f4c2d060feebb2866ba1d38
    steps:
      - uses: actions/checkout@v4

      - name: Install simulation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy>=1.26' 'pandas>=2.2' 'matplotlib>=3.8' \
            'pandapower>=3.5' 'dss-python>=0.15' 'networkx>=3.2'

      - name: Checkout pinned canonical OpenDSS test feeders
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/tshort/OpenDSS.git /tmp/OpenDSS
          cd /tmp/OpenDSS
          git checkout "$OPENDSS_COMMIT" -- Distrib/IEEETestCases/123Bus Distrib/IEEETestCases/8500-Node License.txt
          echo "$OPENDSS_COMMIT" > /tmp/opendss_commit.txt

      - name: Run five-seed feeder experiments
        working-directory: manuscript
        run: |
          mkdir -p figures/results figures/final_feeder_results
          python figures/Code/feeder_runtime_experiments.py \
            --env-zip figures/Code/kgfedmarl_env.zip \
            --opendss-root /tmp/OpenDSS \
            --output figures/results/feeder_runs.csv \
            --seeds 5 \
            --source-commit "$GITHUB_SHA"

      - name: Generate four final result groups
        working-directory: manuscript
        run: |
          python figures/Code/plot_feeder_results.py \
            --input figures/results/feeder_runs.csv \
            --output-dir figures/final_feeder_results \
            --min-seeds 5 \
            --baseline-feeder IEEE33 \
            --intensity-feeder IEEE33 \
            --ablation-feeder IEEE33 \
            --baseline-attack-type mixed \
            --baseline-attack-level medium

      - name: Print summary tables
        working-directory: manuscript
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          p=Path('figures/final_feeder_results')
          for f in sorted(p.glob('*.csv')):
              print('\n====', f.name, '====')
              print(pd.read_csv(f).to_string(index=False))
          print('\n==== per-seed rows ====')
          df=pd.read_csv('figures/results/feeder_runs.csv')
          print('rows',len(df),'feeders',df.feeder.value_counts().to_dict())
          print('status',df.status.value_counts().to_dict())
          PY

      - name: Package provenance manifest
        working-directory: manuscript
        run: |
          cp /tmp/opendss_commit.txt figures/results/opendss_commit.txt
          sha256sum figures/Code/kgfedmarl_env.zip > figures/results/env_zip_sha256.txt
          git rev-parse HEAD > figures/results/kgfedmarl_commit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feeder-final-results
          path: |
            manuscript/figures/results
            manuscript/figures/final_feeder_results
          retention-days: 14
