name: Feeder environment probe

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect 8500 and IEEE123 assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/env /tmp/o /tmp/sol /tmp/csv
          mkdir -p /tmp/env /tmp/o /tmp/sol /tmp/csv
          unzip -q manuscript/figures/Code/kgfedmarl_env.zip -d /tmp/env
          unzip -q /tmp/env/configs/8500node.zip -d /tmp/o
          echo '=== SOLUTIONS ZIP ==='
          unzip -l /tmp/o/Solutions.zip | sed -n '1,700p'
          unzip -q /tmp/o/Solutions.zip -d /tmp/sol
          echo '=== SOLUTIONS FILE TREE ==='
          find /tmp/sol -maxdepth 7 -type f -printf '%P\t%s bytes\n' | sort | sed -n '1,900p'
          echo '=== EXECUTABLE MODEL CANDIDATES ==='
          find /tmp/sol -type f \( -iname '*.dss' -o -iname '*.glm' -o -iname '*.raw' -o -iname '*.m' -o -iname '*.py' -o -iname '*.xml' \) -print | sort | sed -n '1,500p'
          unzip -q '/tmp/o/IEEE-8500Node-CSV-R2b.zip' -d /tmp/csv
          echo '=== LINE CODES ==='
          sed -n '1,340p' /tmp/csv/LineCodes2.dat
          echo '=== SOURCE ==='
          cat /tmp/csv/Source.dat
          echo '=== PRIMARY LINE COUNTS / STATUS ==='
          python - <<'PY'
          import csv, pathlib, re
          root=pathlib.Path('/tmp/csv')
          def data_rows(path):
              lines=[]
              for s in path.read_text(errors='ignore').splitlines():
                  if s.strip() and not s.lstrip().startswith('#'): lines.append(s)
              return list(csv.DictReader(lines, skipinitialspace=True))
          for name in ['Lines.csv','Loads.CSV','LoadXfmrs.csv','Triplex_Lines.csv','Regulators.csv','Transformers.csv','Buscoords.csv']:
              rows=data_rows(root/name)
              print(name, len(rows), list(rows[0].keys()) if rows else [])
          rows=data_rows(root/'Lines.csv')
          statuses={}
          for r in rows:
              v=(r.get('Status') or r.get(' Status   ') or '').strip()
              statuses[v]=statuses.get(v,0)+1
          print('line_statuses', statuses)
          buses=set()
          for r in rows:
              buses.add((r.get('Bus1') or '').strip()); buses.add((r.get('Bus2') or '').strip())
          print('primary_line_unique_buses', len(buses))
          PY
          echo '=== IEEE123 DEPENDENCY INVENTORY ==='
          grep -Ein '^\s*(redirect|compile)' /tmp/env/configs/IEEE123Master.dss || true
          find /tmp/env/configs -maxdepth 2 -type f -printf '%f\n' | sort
